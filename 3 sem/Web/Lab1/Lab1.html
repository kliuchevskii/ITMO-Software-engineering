<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторная работа №1. Попадание точки в область</title>
    <link rel="stylesheet" href="styles-1.css">
</head>
<body>
<div class="page">

    <header class="header">
        <div class="header-item">ФИО: <span class="value">Ключевский Дмитрий Олегович</span></div>
        <div class="header-item">Группа: <span class="value">P3208</span></div>
        <div class="header-item">Вариант: <span class="value">12632</span></div>
    </header>

    <main class="content">
        <section class="card plane-card">
            <h2>Координатная плоскость</h2>
            <canvas id="plane" width="480" height="480"></canvas>
        </section>

        <section class="card form-card">
            <h2>Проверка</h2>
            <form id="point-form" novalidate>
                <fieldset class="field-group">
                    <legend>Координата X</legend>
                    <label class="select-all"><input type="checkbox" id="x-all"> Выбрать все</label>
                    <div class="checkbox-list" id="x-checkboxes"></div>
                    <div class="error-msg" id="x-error"></div>
                </fieldset>

                <fieldset class="field-group">
                    <legend>Координата Y, диапазон: [-3; 3]</legend>
                    <input type="text" id="y-input" name="y" class="text-field" placeholder="Целое или вещественное число" required>
                    <div class="error-msg" id="y-error"></div>
                </fieldset>

                <fieldset class="field-group">
                    <legend>Радиус R</legend>
                    <div class="radius-list" id="r-radius"></div>
                </fieldset>

                <div class="buttons-row">
                    <button type="submit" class="btn" id="submit-btn">Проверить точку</button>
                    <button type="button" class="btn btn-secondary" id="clear-btn">Очистить историю</button>
                </div>
            </form>
        </section>
    </main>

    <section class="card results-card" id="results">
        <h2>Результаты проверок</h2>
        <div class="table-wrap">
            <table class="results-table">
                <thead>
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                        <th>R</th>
                        <th>Результат</th>
                        <th>Дата и время</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
        <p id="empty-msg" class="empty-msg">История проверок пуста</p>
    </section>

    <footer class="footer">Лабораторная работа №1</footer>

</div>
<script src="app1.js"></script>
</body>
</html>
